spring:
  application:
    name: vista-360

  # La configuración centralizada del ecosistema se resuelve por entorno; aquí se apaga.
  cloud:
    config:
      enabled: false

  # Por defecto el servicio arranca con una base de datos H2 en memoria y datos de
  # ejemplo, sin necesidad de instalar nada. Para PostgreSQL: perfil 'prod' (ver README).
  datasource:
    url: jdbc:h2:mem:vista360;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration,classpath:db/seed
    encoding: UTF-8

app:
  security:
    jwt:
      # 'hmac' -> valida el JWT con un secreto simétrico (desarrollo/pruebas).
      # 'issuer' -> valida contra la plataforma de identidad (perfil 'prod').
      strategy: hmac
      hmac-secret: ${JWT_HMAC_SECRET:clave-solo-para-desarrollo-local-no-usar-en-produccion-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

server:
  error:
    include-message: always

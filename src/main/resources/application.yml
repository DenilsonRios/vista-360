spring:
  application:
    name: vista-360

  # La configuración centralizada del ecosistema se resuelve por entorno; en local se apaga.
  cloud:
    config:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vista360}
    username: ${DB_USERNAME:vista360}
    password: ${DB_PASSWORD:vista360}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    encoding: UTF-8

app:
  security:
    jwt:
      # Validación de JWT por secreto simétrico (HS256).
      # En producción se sustituye por la validación contra la plataforma de identidad
      # definiendo la variable OIDC_ISSUER_URI (ver application-prod.yml de ejemplo en el README).
      hmac-secret: ${JWT_HMAC_SECRET:cambiar-en-produccion-clave-de-desarrollo-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

server:
  error:
    include-message: always

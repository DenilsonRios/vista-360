# Perfil de desarrollo local: base de datos H2 en memoria y datos de ejemplo.
# Uso:  ./gradlew bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    url: jdbc:h2:mem:vista360;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  flyway:
    # Añade los datos semilla a las migraciones de esquema.
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    jwt:
      hmac-secret: clave-solo-para-desarrollo-local-no-usar-en-produccion-0123456789
